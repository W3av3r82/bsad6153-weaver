name: Forecast sync

on:
  schedule:
    # UTC year-round: 05:17/17:17 Central Standard, 06:17/18:17 Central Daylight.
    - cron: '17 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sync dependencies
        run: python -m pip install requests==2.34.2 'psycopg[binary]==3.3.6' python-dotenv==1.2.4
      - name: Refresh both towns and record outcome
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
          SYNC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: python -B ingest/sync.py --apply --trigger "$SYNC_TRIGGER"
